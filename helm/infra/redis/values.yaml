fullnameOverride: redis
architecture: standalone

auth:
  enabled: true
  # password: app333
  acl:
    enabled: true
    users:
      - username: app
        # password: app333
        enabled: "on"
        commands: "+@all"
        keys: "~*"
        channels: "&*"

master:
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

networkPolicy:
  enabled: false
