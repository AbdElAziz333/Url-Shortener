fullnameOverride: mongo
architecture: standalone

livenessProbe:
  enabled: true
  initialDelaySeconds: 40
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6

auth:
  enabled: true
  rootUser: az
  existingSecret: mongo-secret

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

networkPolicy:
  enabled: false

metrics:
  enabled: true
  extraFlags: "--compatible-mode"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    timeoutSeconds: 10

  readinessProbe:
    enabled: true
    initialDelaySeconds: 15
    timeoutSeconds: 10

  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus