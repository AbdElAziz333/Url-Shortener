fullnameOverride: postgres

auth:
  enablePostgresUser: true
  username: aziz
  database: postgres
  existingSecret: postgres-secret
  secretKeys:
    postgresPassword: postgres-password
    password: password

primary:
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  networkPolicy:
    enabled: false
  initdb:
    scripts:
      00-init-databases.sql: |
        CREATE DATABASE gateway;
        CREATE DATABASE shortener;
        CREATE DATABASE analytics;
        GRANT ALL PRIVILEGES ON DATABASE gateway TO "aziz";
        GRANT ALL PRIVILEGES ON DATABASE shortener TO "aziz";
        GRANT ALL PRIVILEGES ON DATABASE analytics TO "aziz";