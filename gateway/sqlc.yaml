version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/query.sql"
    schema: "migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/postgres/sqlc"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
