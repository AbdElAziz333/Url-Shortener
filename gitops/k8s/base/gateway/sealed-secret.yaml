---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gateway-secret
  namespace: url-shortener
spec:
  encryptedData:
    JWT_ACCESS_SECRET: 
    JWT_REFRESH_SECRET: 
    POSTGRES_PASSWORD: 
    REDIS_PASSWORD: 
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: url-shortener
      name: gateway-secret
      namespace: url-shortener
    type: Opaque
