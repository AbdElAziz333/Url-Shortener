apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: url-shortener
  annotations:
    # CRITICAL FOR GKE: Enables container-native load balancing
    cloud.google.com/neg: '{"ingress": true}'
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: url-shortener
spec:
  type: ClusterIP # Keeps your microservice private within the cluster network
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP