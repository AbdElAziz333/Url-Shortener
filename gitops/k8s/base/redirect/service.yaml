apiVersion: v1
kind: Service
metadata:
  name: redirect
  namespace: url-shortener
  labels:
    app: redirect
    app.kubernetes.io/name: redirect
    app.kubernetes.io/part-of: url-shortener
spec:
  type: ClusterIP
  selector:
    app: redirect
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
 