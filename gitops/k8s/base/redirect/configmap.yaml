apiVersion: v1
kind: ConfigMap
metadata:
  name: redirect-config
  namespace: url-shortener
  labels:
    app: redirect
    app.kubernetes.io/name: redirect
    app.kubernetes.io/part-of: url-shortener
data:
  APP_ENV: "kubernetes"
  SERVICE_NAME: "redirect"
  SERVICE_PORT: "8082"
  POSTGRES_HOST: "postgres"
  POSTGRES_DB: "shortener"
  POSTGRES_USER: "aziz"
  REDIS_ADDR: "redis-master:6379"
  REDIS_USER: "default"
