apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-shortener-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AbdElAziz333/url-shortener-gitops.git
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true