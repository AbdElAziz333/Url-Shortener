services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/init-topics.sh:/init-topics.sh
    networks:
      - url-shortener-net
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    profiles:
      - all
      - infra
      - messaging

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh
    networks:
      - url-shortener-net
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"
    profiles:
      - all
      - infra
      - messaging

  prometheus:
    image: prom/prometheus:v3
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - url-shortener-net
    restart: unless-stopped
    profiles:
      - all
      - infra
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/grafana:13.1.0-25893932881
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - url-shortener-net
    restart: unless-stopped
    profiles:
      - all
      - infra
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  node-exporter:
    image: prom/node-exporter:v1
    ports:
      - "9100:9100"
    networks:
      - url-shortener-net
    restart: unless-stopped
    profiles:
      - all
      - infra
      - monitoring
      - exporter

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    ports:
      - "9187:9187"
    networks:
      - url-shortener-net
    restart: unless-stopped
    profiles:
      - all
      - infra
      - monitoring
      - exporter
    environment:
      DATA_SOURCE_NAME: user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} host=postgres port=5432 dbname=postgres sslmode=disable
    command: ["--auto-discover-databases"]
    depends_on:
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
  
  mongo-exporter:
    image: percona/mongodb_exporter:0.51
    ports:
      - "9216:9216"
    networks:
      - url-shortener-net
    restart: unless-stopped
    profiles:
      - all
      - infra
      - monitoring
      - exporter
    command:
      - "--mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/admin?authSource=admin&ssl=false"
      - "--collector.diagnosticdata"
      - "--collector.replicasetstatus"
    depends_on:
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0-alpine
    ports:
      - "9121:9121"
    networks:
      - url-shortener-net
    restart: unless-stopped
    profiles:
      - all
      - infra
      - monitoring
      - exporter
    environment:
      REDIS_ADDR: redis:6379
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    ports:
      - "9308:9308"
    networks:
      - url-shortener-net
    restart: unless-stopped
    profiles:
      - all
      - infra
      - monitoring
      - exporter
    entrypoint: [ "/bin/kafka_exporter", "--kafka.server=kafka:9092" ]
    depends_on:
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy

volumes:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  url-shortener-net:
    external: true
    driver: bridge