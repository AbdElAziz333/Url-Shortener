name: CI

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'shortener/**'
      - 'redirect/**'
      - 'analytics/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'shortener/**'
      - 'redirect/**'
      - 'analytics/**'
      - '.github/workflows/**'

env:
  GO_VERSION: "1.23"
  REGISTRY: docker.io
  IMAGE_PREFIX: abdelaziz333

jobs:
  test:
    name: Test – ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, shortener, redirect, analytics]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go (Fresh Slate)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run Unit Tests
        env:
          GOFLAGS: ""
        run: go test ./... -run "Unit" -v

      - name: Run Integration Tests
        env:
          GOFLAGS: ""
        run: go test ./... -run "Integration" -v -timeout 300s

  build-and-scan:
    name: Build & Scan – ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, shortener, redirect, analytics]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'