name: CI

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'shortener/**'
      - 'redirect/**'
      - 'analytics/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'shortener/**'
      - 'redirect/**'
      - 'analytics/**'
      - '.github/workflows/**'

env:
  GO_VERSION: "1.23"

jobs:
  test:
    name: Test – ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, shortener, redirect, analytics]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Run Unit Tests
        run: |
          go test ./... -run "Unit" -v -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.out
          retention-days: 7

      - name: Run Integration Tests
        run: |
          go test ./... -run "Integration" -v -timeout 300s