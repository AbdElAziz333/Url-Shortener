name: CI

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'shortener/**'
      - 'redirect/**'
      - 'analytics/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'shortener/**'
      - 'redirect/**'
      - 'analytics/**'
      - '.github/workflows/**'

env:
  GO_VERSION: "1.23"

jobs:
  test:
    name: Test – ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, shortener, redirect, analytics]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go (Fresh Slate)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run Unit Tests
        env:
          GOFLAGS: ""
        run: go test ./... -run "Unit" -v

      - name: Run Integration Tests
        env:
          GOFLAGS: ""
        run: go test ./... -run "Integration" -v -timeout 300s