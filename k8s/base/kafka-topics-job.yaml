# Run once after Kafka is up (same topics as docker-compose init-topics).
# Re-apply safe: script uses --create --if-not-exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: url-shortener
  labels:
    app.kubernetes.io/part-of: url-shortener
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: url-shortener
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-topics
          image: docker.io/bitnami/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              BOOTSTRAP="${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
              TOPICS=(
                urls.created
                urls.deleted
                redirects.requested
                redirects.resolved
                redirects.failed
                analytics.aggregated
              )
              for t in "${TOPICS[@]}"; do
                /opt/bitnami/kafka/bin/kafka-topics.sh \
                  --create --if-not-exists \
                  --bootstrap-server "$BOOTSTRAP" \
                  --topic "$t" \
                  --replication-factor 1 \
                  --partitions 1
              done
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
