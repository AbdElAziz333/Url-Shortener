apiVersion: v1
kind: ConfigMap
metadata:
  name: shortener-config
  namespace: url-shortener
  labels:
    app: shortener
    app.kubernetes.io/name: shortener
    app.kubernetes.io/part-of: url-shortener
data:
  APP_ENV: "kubernetes"
  SERVICE_NAME: "shortener"
  SERVICE_PORT: "8081"
  POSTGRES_HOST: "postgres"
  POSTGRES_DB: "shortener"
  POSTGRES_USER: "aziz"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_GROUP_ID: "shortener-service"
