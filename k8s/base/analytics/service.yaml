apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: url-shortener
  labels:
    app: analytics
    app.kubernetes.io/name: analytics
    app.kubernetes.io/part-of: url-shortener
spec:
  type: ClusterIP
  selector:
    app: analytics
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
 