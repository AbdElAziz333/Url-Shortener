apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://strimzi.io/charts
      chart: kafka
      targetRevision: 1.0.0
      helm:
        valueFiles:
          - $values/helm/infra/kafka/values.yaml
    - repoURL: https://github.com/AbdElAziz333/url-shortener-gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true