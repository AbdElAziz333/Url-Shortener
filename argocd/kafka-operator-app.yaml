apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://strimzi.io/charts
      chart: strimzi-kafka-operator
      targetRevision: 0.45.0
      helm:
        valueFiles:
          - $values/helm/infra/kafka-operator/values.yaml
    - repoURL: https://github.com/AbdElAziz333/url-shortener-gitops.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true